name: Build release images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - name: Backend tests (isolated SQLite)
        working-directory: backend
        env:
          APP_DATABASE_MODE: sqlite
        run: python -m unittest discover -s tests -v
      - name: Deployment safety tests
        run: python -m unittest discover -s deploy/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          echo "version=sha-${GITHUB_SHA:0:12}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.repository }}/backend:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.release-frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.repository }}/frontend:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Record immutable image digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e = os.environ
          result = dict(version=e['VERSION'], commit=e['GITHUB_SHA'],
            backend=e['REPOSITORY']+'/backend@'+e['BACKEND_DIGEST'],
            frontend=e['REPOSITORY']+'/frontend@'+e['FRONTEND_DIGEST'])
          Path('release.json').write_text(json.dumps(result, indent=2)+'\n')
          with open(e['GITHUB_STEP_SUMMARY'], 'a') as out:
            out.write('Version: `'+e['VERSION']+'`\n\nRun ID: `'+e['GITHUB_RUN_ID']+'`\n\nDownload release-manifest or run Deploy release → stage.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
          retention-days: 90
