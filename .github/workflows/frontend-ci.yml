name: Frontend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BASE" "$HEAD" -- frontend deploy/Dockerfile.frontend deploy/Caddyfile deploy/frontend-apply.sh deploy/check-frontend.sh deploy/tests .dockerignore .github)
            if [[ -n "$changed" ]]; then
              echo 'frontend=true' >> "$GITHUB_OUTPUT"
            else
              echo 'frontend=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  workflow_lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check workflow expressions and job dependencies
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck='' -pyflakes=''
  quick:
    needs: [changes, workflow_lint]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-frontend
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build:assets
        working-directory: frontend
        env:
          VITE_APP_VERSION: ci-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: error
  smoke:
    needs: [changes, quick]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-e2e.yml
    with:
      artifact: frontend-dist
      suite: smoke
  required:
    name: frontend-required
    if: always()
    needs: [changes, workflow_lint, quick, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      WORKFLOW_LINT: ${{ needs.workflow_lint.result }}
      CHANGES: ${{ needs.changes.result }}
      FRONTEND: ${{ needs.changes.outputs.frontend }}
      QUICK: ${{ needs.quick.result }}
      SMOKE: ${{ needs.smoke.result }}
      EVENT: ${{ github.event_name }}
    steps:
      - run: |
          [[ "$WORKFLOW_LINT" == success ]] || exit 1
          [[ "$CHANGES" == success ]]
          if [[ "$FRONTEND" == true ]]; then
            [[ "$QUICK" == success ]]
            if [[ "$EVENT" == push ]]; then [[ "$SMOKE" == success ]]; fi
          else
            [[ "$FRONTEND" == false && "$QUICK" == skipped && "$SMOKE" == skipped ]]
          fi
