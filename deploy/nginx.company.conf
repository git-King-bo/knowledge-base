server {
    listen 80;
    listen [::]:80;
    server_name future.ops.originhub.tech;
    client_max_body_size 25m;
    access_log /var/log/nginx/knowledge-base-access.log;
    error_log /var/log/nginx/knowledge-base-error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # HTTP deployment: production application sets Secure by default.
        # Remove this exception when enabling HTTPS for this domain.
        proxy_cookie_flags kb_session nosecure;
    }
}
